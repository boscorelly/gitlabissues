name: Release archives

# When a release is published on GitHub, build glpi-gitlabissues-<version>.tar.bz2 / .zip
# (folder "gitlabissues/" inside, as GLPI expects) and attach them to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to a commit (a moving tag like @v4 could be repointed to other code).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check that the tag matches the plugin version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          FILE_VERSION=$(sed -n "s/.*define('PLUGIN_GITLABISSUES_VERSION', '\(.*\)');.*/\1/p" setup.php)
          [ "$VERSION" = "$FILE_VERSION" ] || { echo "Tag $TAG != setup.php version $FILE_VERSION"; exit 1; }
          grep -q "<num>$VERSION</num>" gitlabissues.xml || { echo "Version $VERSION missing in gitlabissues.xml"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'

      - name: Unit tests
        run: php tests/html_to_markdown_test.php

      - name: Build archives
        run: tools/build-release.sh "$VERSION"

      - name: Attach archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
